name: Upstream release check
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Inspect upstream without upgrading
        run: |
          python3 skills/gpu-resume/scripts/gpu_resume.py check-updates > upstream-check.json
          {
            echo '### SkyPilot release check'
            echo '```json'
            cat upstream-check.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
