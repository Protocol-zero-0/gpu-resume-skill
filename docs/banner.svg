<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">GPU Resume</title>
  <desc id="desc">A task continues across an interruption using a durable checkpoint.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111e32"/><stop offset="1" stop-color="#080e1b"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#263449"/></pattern>
  </defs>
  <rect width="1100" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1100" height="300" rx="20" fill="url(#grid)" opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="72" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="3">POWERED BY SKYPILOT</text>
    <text x="55" y="143" fill="#f1f5f9" font-size="59" font-weight="700" letter-spacing="-2">GPU Resume</text>
    <text x="58" y="183" fill="#a8b8cd" font-size="19">Interruptible compute. Durable progress.</text>
    <rect x="58" y="216" width="189" height="30" rx="15" fill="#143040"/>
    <text x="75" y="236" fill="#7dd3fc" font-size="12" letter-spacing="1">AGENT SKILL + TEMPLATES</text>
    <path d="M632 147h110" stroke="#38bdf8" stroke-width="3"/>
    <path d="M742 147h92" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 7"/>
    <path d="M834 147h148" stroke="#38bdf8" stroke-width="3"/>
    <g fill="#102c40" stroke="#38bdf8" stroke-width="2">
      <rect x="595" y="113" width="70" height="70" rx="12"/>
      <rect x="892" y="113" width="70" height="70" rx="12"/>
    </g>
    <g fill="none" stroke="#7dd3fc" stroke-width="2">
      <rect x="617" y="135" width="26" height="26" rx="4"/>
      <path d="M623 127v8m14-8v8m-14 26v8m14-8v8m-28-28h8m26 0h8m-42 14h8m26 0h8"/>
      <path d="m910 148 10 10 22-22" stroke-width="4"/>
    </g>
    <circle cx="782" cy="147" r="15" fill="#30291d" stroke="#fbbf24" stroke-width="2"/>
    <path d="M778 141v12m8-12v12" stroke="#fbbf24" stroke-width="3"/>
    <g fill="#a8b8cd" font-size="13" text-anchor="middle">
      <text x="630" y="210">checkpoint</text><text x="782" y="210">interruption</text><text x="927" y="210">resume</text>
    </g>
  </g>
</svg>
